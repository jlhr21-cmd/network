<!doctype html>
<head>
<style>
*{box-sizing:border-box;margin:0}
body{font-size:22px;line-height:2;background-color:black;color:white}
.contenedor{max-width:960px;margin:100px auto;padding:10px;display:grid;grid-template-columns:auto auto auto; grid-auto-flow:column;grid-auto-flow:row; }
.parte{background-color:red;text-align:center;font-family:verdana;font-weight:bold;padding:22px;
border:2px solid yellow;
border-radius:8px;font-size:2em;cursor:pointer}
.parte:hover{color:black}
.parte-1{background-color:orange;grid-area:1/1/span 2/span 3}
.parte-2{background-color:skyblue}
.parte-3{background-color:green}
.parte-4{background-color:yellow}
.parte-5{background-color:pink}
.parte-6{background-color:blue}
.parte-7{background-color:violet}
.parte-8{background-color:gray}
</style>
</head>
<body>
<div class=contenedor>
<div class="parte parte-1">uno</div>
<div class="parte parte-2">dos</div>
<div class="parte parte-3">tres</div>
<div class="parte parte-4">cuatro</div>
<div class="parte parte-5">quinto</div>
<div class="parte parte-6">sexto</div>
<div class="parte parte-7">setimo</div>
<div class="parte parte-8">octavo</div>

</div>

</body>
